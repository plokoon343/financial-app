name: lib-tests

# Fast guard for the dependency-free backend libraries (parsing, reconciliation,
# dedupe, categorisation). They are pure modules, so no npm install is needed. The
# runner picks up every lib/*.test.js automatically.
on:
  push:
    branches: [main]
    paths:
      - 'backend/lib/**'
      - 'backend/scripts/run-lib-tests.js'
      - '.github/workflows/lib-tests.yml'
  pull_request:
    paths:
      - 'backend/lib/**'
      - 'backend/scripts/run-lib-tests.js'
      - '.github/workflows/lib-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-lib-tests.js
