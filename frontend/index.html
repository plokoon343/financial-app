<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#139DA0" />
    <meta name="description" content="Automonie: see where your money went, set budgets, track goals and stay ahead of bills." />
    <title>Automonie</title>
    <link rel="icon" href="/favicon.ico" />

      @font-face { font-family: 'Poppins'; font-weight: 800; font-display: swap; src: url(/fonts/Poppins-800ExtraBold.woff2) format('woff2'); }
